[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-personal-assistant"
version = "0.1.0"
description = "AI Personal Assistant with multi-platform support (Telegram, Web)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "anthropic>=0.28.0",
    "aiofiles>=23.2.0",
    "gradio>=6.0.1",
    "itchat-uos>=1.4.1",
    "openai>=1.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "python-multipart>=0.0.6",
    "requests>=2.32.5",
    "mcp>=1.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.122.0",
    "uvicorn>=0.38.0",
    "claude-agent-sdk>=0.1.19",
    "aiohttp-sse>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "plugins*", "utils*"]
namespaces = false
