[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z-image-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28.0",
    "aiofiles>=23.2.0",
    "gradio>=6.0.1",
    "itchat-uos>=1.4.1",
    "pillow>=12.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "python-multipart>=0.0.6",
    "requests>=2.32.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "plugins*", "utils*"]
namespaces = false
